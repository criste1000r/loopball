services:
  - type: web
    name: loopball
    runtime: node
    plan: free
    region: virginia
    buildCommand: echo "Nothing to build"
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL   # Neon connection string; keeps ranks safe across restarts (see README)
        sync: false
